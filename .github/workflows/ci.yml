name: NexBank CI Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, development]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        app: [client, server]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install dependencies (${{ matrix.app }})
        working-directory: ${{ matrix.app }}
        run: npm ci

      - name: Run tests (${{ matrix.app }})
        working-directory: ${{ matrix.app }}
        run: npm test -- --watchAll=false
        env:
          CI: true

      - name: Build frontend only
        if: matrix.app == 'client'
        working-directory: client
        run: npm run build
        env:
          CI: true
          REACT_APP_API_BASE_URL: /api

  container-validation:
    runs-on: ubuntu-latest
    needs: test-and-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t nexbank-backend:ci ./server

      - name: Build frontend Docker image
        run: docker build --build-arg REACT_APP_API_BASE_URL=/api -t nexbank-frontend:ci ./client

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Validate Kubernetes manifests
        run: |
          echo "Validating Kubernetes YAML files..."
          kubectl version --client
          kubectl apply --dry-run=client -f k8s/