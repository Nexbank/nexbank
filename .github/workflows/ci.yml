name: NexBank CI Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, development]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Run frontend tests
        run: npm test -- --runInBand --watchAll=false
        working-directory: client
        env:
          CI: true

      - name: Run backend tests
        run: npm test
        working-directory: server

      - name: Build frontend
        run: npm run build
        working-directory: client
        env:
          CI: true
          REACT_APP_API_BASE_URL: /api

  container-validation:
    runs-on: ubuntu-latest
    needs: test-and-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t nexbank-backend:ci ./server

      - name: Build frontend image
        run: docker build --build-arg REACT_APP_API_BASE_URL=/api -t nexbank-frontend:ci ./client

      - name: Validate Kubernetes manifests
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Dry-run manifests
        run: kubectl apply --dry-run=client -f k8s/
