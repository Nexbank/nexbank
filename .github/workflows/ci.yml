name: NexBank CI Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, development]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        app: [client, server]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install dependencies (${{ matrix.app }})
        working-directory: ${{ matrix.app }}
        run: npm ci

      - name: Run tests (${{ matrix.app }})
        working-directory: ${{ matrix.app }}
        run: npm test -- --watchAll=false
        env:
          CI: true

      - name: Build frontend only
        if: matrix.app == 'client'
        working-directory: client
        run: npm run build
        env:
          CI: true
          REACT_APP_API_BASE_URL: https://nexbank-backend-o3kz.onrender.com/api

  container-validation:
    runs-on: ubuntu-latest
    needs: test-and-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t nexbank-backend:ci ./server

      - name: Build frontend Docker image
        run: docker build --build-arg REACT_APP_API_BASE_URL=https://nexbank-backend-o3kz.onrender.com/api -t nexbank-frontend:ci ./client

      - name: Setup Node.js for config validation
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root validation dependencies
        run: npm ci

      - name: Validate Docker Compose file
        run: docker compose config

      - name: Validate Prometheus config
        run: docker run --rm -v "$PWD/monitoring:/etc/prometheus:ro" prom/prometheus:v2.55.1 promtool check config /etc/prometheus/prometheus.yml

      - name: Validate Grafana dashboard JSON
        run: jq empty monitoring/grafana/dashboards/nexbank-api-dashboard.json

      - name: Validate Kubernetes YAML
        run: node -e "const fs=require('fs'); const path=require('path'); const YAML=require('yaml'); for (const file of fs.readdirSync('k8s').filter((name)=>name.endsWith('.yaml'))) { const body=fs.readFileSync(path.join('k8s', file), 'utf8'); YAML.parseAllDocuments(body).forEach((doc)=>{ if (doc.errors.length) throw new Error(`${file}: ${doc.errors[0].message}`); }); }"
