services:
  mongodb:
    image: mongo:7
    container_name: nexbank-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: nexbank
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend:
    build:
      context: ./server
    container_name: nexbank-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/nexbank
      JWT_SECRET: nexbank-dev-secret
      EMAIL_USER: demo@example.com
      EMAIL_PASS: demo-password
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./client
      args:
        REACT_APP_API_BASE_URL: /api
    container_name: nexbank-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  mongodb-data:
