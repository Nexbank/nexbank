apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: nexbank
type: Opaque
stringData:
  MONGO_URI: mongodb://mongodb:27017/nexbank
  JWT_SECRET: nexbank-dev-secret
  EMAIL_USER: demo@example.com
  EMAIL_PASS: demo-password
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: nexbank
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: nexbank-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: PORT
              value: "5000"
            - name: NODE_ENV
              value: production
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: MONGO_URI
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: JWT_SECRET
            - name: EMAIL_USER
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: EMAIL_USER
            - name: EMAIL_PASS
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: EMAIL_PASS
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: nexbank
spec:
  selector:
    app: backend
  ports:
    - port: 5000
      targetPort: 5000
